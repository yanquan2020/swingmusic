name: New armv7 Release
run-name: Release v${{ github.event.inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag"
        required: true
        default: "1.x.x"
jobs:
  build:
    runs-on: [ubuntu-20.04]
    name: Building armv7 binary
    steps:
      - name: Checking out buildscript
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            armv7_buildscript
          sparse-checkout-cone-mode: false
      - name: Installing Packages
        run: |
          sudo apt -qq update -y > /dev/null
          sudo apt -y -qq install binfmt-support qemu-user-static systemd-container wget > /dev/null
      - name: Starting Services
        run: |
          sudo systemctl restart systemd-binfmt
          sudo systemctl start systemd-resolved
      - name: Downloading Arch Linux Arm Tarball for rpi2/3 armv7
        run: |
          wget -q http://os.archlinuxarm.org/os/ArchLinuxARM-rpi-2-latest.tar.gz
      - name: Extracting Tarball
        run: |
          mkdir root
          sudo tar xpf ArchLinuxARM-rpi-2-latest.tar.gz -C root --warning=no-unknown-keyword
      - name: Building Swingmusic in qemu
        run: |
          chmod +x armv7_buildscript
          sed -i -e 's/TAG/${{ github.event.inputs.tag }}/g' armv7_buildscript
          mv armv7_buildscript root/
          sudo systemd-nspawn --bind-ro=/etc/resolv.conf -D root ./armv7_buildscript
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          draft: false
          prerelease: false
      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./root/swingmusicbuilder/swingmusic/dist/swingmusic
          asset_name: swingmusic
          asset_content_type: application/octet-stream
